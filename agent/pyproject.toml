[project]
name = "teams-avatar-agent"
version = "0.1.0"
description = "Real-time AI avatar Teams participant — LiveKit Agents orchestration (Iris)."
requires-python = ">=3.11,<3.13"
dependencies = [
  "livekit-agents[deepgram,elevenlabs,anthropic,silero,turn-detector,bey,liveavatar]>=1.5.0,<2.0.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
